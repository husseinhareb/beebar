# beebar config — pill-grouped top bar (Catppuccin Mocha, waybar-style)

[bar.top]
height = 50
background = "#00000000"        # fully transparent bar surface; only pills show
foreground = "#cdd6f4"
font = "JetBrainsMono Nerd Font"
font_size = 13.5
bold = true                      # render all text at Pango Weight::Bold
padding_left = 8.0
padding_right = 8.0
position = "top"

# ── Refresh rate ──────────────────────────────────────────────────────────────
# How often (in milliseconds) modules are polled and the bar is redrawn.
# Lower values feel more responsive; higher values reduce CPU usage.
# refresh_interval_ms = 200   # default: 200 ms (5 Hz)

# ── Pill styling ──────────────────────────────────────────────────────────────
# Vertical inset of pills from the bar edges, horizontal gap between pills,
# and the shared rounded background color (~80% opacity dark, like waybar).
margin_top      = 10.0
margin_bottom   = 6.0
margin_left     = 10.0
margin_right    = 10.0
group_spacing   = 10.0
corner_radius   = 6.0
module_background = "#1e1e2ecc"

# ── Pill groups (each inner array = one continuous pill) ──────────────────────
groups_left = [
    ["clock"],
    ["workspaces"],
]
groups_center = [
    ["window"],
]
groups_right = [
    ["network", "bluetooth"],
    ["temperature", "battery"],
    ["brightness", "volume", "microphone"],
    ["tray"],
    ["screencast"],
]

# ── Workspaces ────────────────────────────────────────────────────────────────

[module.workspaces]
type = "workspaces"
refresh_interval_ms = 100        # tight polling for snappy focus tracking
count = 10
labels = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "0"]
active_color   = "#cba6f7"
occupied_color = "#a6adc8"
empty_color    = "#585b70"

# ── Clock (mint-green, matches waybar #clock) ─────────────────────────────────
# `` U+F017 = nf-fa-clock, `` U+F073 = nf-fa-calendar.

[module.clock]
type = "clock"
refresh_interval_ms = 1000
# 󰥔 = nf-md-clock-time-eight, 󰃭 = nf-md-calendar
format = "󰥔 %I:%M %p   󰃭 %a, %b %e"
foreground = "#00d483"

# ── Window (centre pill, shows the active window title) ──────────────────────
# `backend` selects where the title comes from:
#   - "beewm"     — read /tmp/beewm_window (beewm writes the focused title here)
#   - "hyprland"  — `hyprctl activewindow -j`
#   - "auto"      — prefer /tmp/beewm_window when present, fall back to hyprctl

[module.window]
type = "window"
refresh_interval_ms = 100        # tight polling — feels instant on focus changes
backend = "auto"
max_length = 80
empty_label = ""
foreground = "#cdd6f4"

# ── Playback (kept available; not in the default layout) ──────────────────────

[module.playback]
type = "playback"
refresh_interval_ms = 1000
format = "{icon} {track}  {buttons}"
foreground = "#cdd6f4"
# Playback control button icons (defaults shown):
# icon_previous = "󰒮"
# icon_stop     = "󰓛"
# icon_play     = "󰐊"
# icon_pause    = "󰏤"
# icon_next     = "󰒭"

# ── Network (blue, like waybar #network) ──────────────────────────────────────

[module.network]
type = "network"
refresh_interval_ms = 1000
format = "󰇚 {download}  󰕒 {upload}"
foreground = "#0099ff"

# ── Bluetooth (blue, like waybar #bluetooth) ──────────────────────────────────

[module.bluetooth]
type = "bluetooth"
refresh_interval_ms = 1000       # update() is a no-op; this just paces redraws
format = "{icon} {status}"
icon_on            = "󰂯"
icon_off           = "󰂲"
icon_no_controller = "󰂲"
foreground = "#0062ff"
# poll_interval_ms = 2000   # default: 2000 ms

# ── CPU ───────────────────────────────────────────────────────────────────────

[module.cpu]
type = "cpu"
refresh_interval_ms = 1000
icon = "󰍛"            # 󰍛 = nf-md-memory (waybar uses the same idea for cpu)
foreground = "#89dceb"

# ── Temperature (teal, with warn/critical highlights) ─────────────────────────

[module.temperature]
type = "temperature"
refresh_interval_ms = 1000
icon = "󰔏"            # 󰔏 = nf-md-thermometer
warn_threshold     = 75.0
critical_threshold = 90.0
warn_color     = "#f9e2af"
critical_color = "#f38ba8"
foreground = "#94e2d5"

# ── Memory (kept for users who want it; not in the default pill layout) ───────

[module.memory]
type = "memory"
refresh_interval_ms = 1000
format = "󰍛 {used}/{total}"

# ── Brightness ────────────────────────────────────────────────────────────────
# Compact form (no slider): renders as `<icon> <pct>%` — matches waybar.

[module.brightness]
type = "brightness"
refresh_interval_ms = 1000
backend = "brightnessctl"
device  = "nvidia_0"
show_slider = false
icon_low    = "󰃚"
icon_medium = "󰃝"
icon_high   = "󰃠"
icon_unknown     = ""
icon_unavailable = "󰃞"
foreground = "#f9e2af"

# ── Volume (output / speakers) ────────────────────────────────────────────────

[module.volume]
type = "volume"
refresh_interval_ms = 1000
target = "sink"
show_slider = false
icon_muted       = "󰝟"
icon_unknown     = ""
icon_low         = "󰕿"
icon_medium      = "󰖀"
icon_high        = "󰕾"
icon_unavailable = "󰖁"
muted_color       = "#f38ba8"
unavailable_color = "#6c7086"
foreground = "#679df5"

# ── Microphone (input / source — second instance of the volume module) ───────

[module.microphone]
type = "volume"
refresh_interval_ms = 1000
target = "source"
show_slider = false
# 󰍬 = nf-md-microphone, 󰍭 = nf-md-microphone-off, 󰍳 = nf-md-microphone-question
icon_muted       = "󰍭"
icon_unknown     = "󰍳"
icon_low         = "󰍬"
icon_medium      = "󰍬"
icon_high        = "󰍬"
icon_unavailable = "󰍭"
muted_color       = "#f38ba8"
unavailable_color = "#6c7086"
foreground = "#bb84ff"

# ── Battery (green, like waybar #battery) ─────────────────────────────────────

[module.battery]
type = "battery"
refresh_interval_ms = 1000
icon_low    = "󰁻"
icon_medium = "󰁾"
icon_high   = "󰂁"
icon_full   = "󰁹"
foreground = "#3acc2d"

# ── System Tray ───────────────────────────────────────────────────────────────

[module.tray]
type = "tray"
refresh_interval_ms = 1000       # cache poll cadence; signals push immediately
icon_size     = 18
padding_left  = 8.0
padding_right = 8.0
icon_spacing  = 8.0

# Red pill naming whoever is capturing the screen (beewm only). Hidden while
# nothing is. Apps sharing through the portal are looked up with pw-dump.
[module.screencast]
type = "screencast"
# icon       = "\u25CF"      # the recording dot
# background = "#d20f39"
# foreground = "#fefefe"
